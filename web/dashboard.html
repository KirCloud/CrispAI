<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>项目概览 · KirCloud</title>
    <link rel="stylesheet" href="/console-assets/console.css" />
    <script type="module" src="/console-assets/console.js"></script>
  </head>
  <body data-page="dashboard">
    <div class="console-layout">
      <aside class="sidebar">
        <a class="brand" href="/dashboard"
          ><span class="brand-mark">K<span></span></span
          ><span>KirCloud<small>客服控制台</small></span></a
        >
        <p class="nav-caption">工作空间</p>
        <nav aria-label="主导航">
          <a class="nav-link active" href="/dashboard" aria-current="page"
            ><span aria-hidden="true">▦</span>项目概览</a
          ><a class="nav-link" href="/settings/ai"
            ><span aria-hidden="true">✧</span>AI 配置</a
          >
        </nav>
        <div class="sidebar-bottom">
          <div class="deployment-label">
            <span class="status-dot"></span>自部署实例
          </div>
          <a
            href="https://github.com/KirCloud/CrispAI"
            target="_blank"
            rel="noopener noreferrer"
            >源代码 <span aria-hidden="true">↗</span></a
          >
        </div>
      </aside>
      <div class="main-column">
        <header class="topbar">
          <div class="breadcrumb">
            工作空间 <span>/</span> <strong>项目概览</strong>
          </div>
          <div class="account">
            <span class="avatar">K</span><span id="account-name">管理员</span
            ><button class="text-button" data-logout>退出登录</button>
          </div>
        </header>
        <main class="content">
          <div class="page-heading">
            <div>
              <span class="eyebrow">WORKSPACE</span>
              <h1>项目概览</h1>
              <p class="muted">管理客服项目，让消息在团队间顺畅流转。</p>
            </div>
            <div class="heading-actions">
              <button class="button secondary" id="import-project">
                导入项目</button
              ><button class="button primary" id="new-project">
                <span aria-hidden="true">＋</span> 新建项目</button
              ><input
                type="file"
                id="import-file"
                accept=".json,application/json"
                hidden
              />
            </div>
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <span>全部项目</span><strong id="stat-total">—</strong
              ><small>你的客服工作空间</small>
            </div>
            <div class="stat-card">
              <span>运行中的项目</span><strong id="stat-active">—</strong
              ><small>已启用的消息处理</small>
            </div>
            <a class="stat-card stat-link" href="/settings/ai"
              ><span>AI 服务 <span aria-hidden="true">↗</span></span
              ><strong class="stat-text" id="stat-ai">检查中</strong
              ><small>统一管理接口与模型</small></a
            >
          </div>
          <div class="section-heading">
            <h2>
              你的项目 <span id="project-count" class="count-badge">0</span>
            </h2>
            <span class="muted small">项目设置 · 消息规则 · 知识库</span>
          </div>
          <p
            id="page-message"
            class="form-message"
            role="status"
            aria-live="polite"
          ></p>
          <div id="projects" class="projects-grid" aria-live="polite">
            <div class="empty-state">正在加载项目…</div>
          </div>
          <div class="bottom-note">
            <span aria-hidden="true">✧</span>
            <p>
              准备好接入 AI 了吗？<a href="/settings/ai"
                >配置 API 与模型 <span aria-hidden="true">→</span></a
              >
            </p>
            <span>接口配置与项目回复开关独立管理</span>
          </div>
        </main>
        <footer class="console-footer">
          <span>KirCloud Console</span><span>基于 CrispAI</span>
        </footer>
      </div>
    </div>
    <dialog id="create-dialog">
      <form id="create-form">
        <div class="dialog-heading">
          <h2>新建项目</h2>
          <button
            type="button"
            class="text-button"
            id="close-dialog"
            aria-label="关闭"
          >
            ✕
          </button>
        </div>
        <p class="muted">给这个客服工作空间起一个名字。</p>
        <label for="project-name">项目名称</label
        ><input
          id="project-name"
          maxlength="100"
          placeholder="例如：商店客服"
          required
        />
        <p id="create-message" class="form-message" role="status"></p>
        <button class="button primary full" type="submit">创建项目</button>
      </form>
    </dialog>
  </body>
</html>
