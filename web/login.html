<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>登录 · CrispAI</title>
    <link rel="stylesheet" href="/console-assets/console.css?v=2" />
    <script type="module" src="/console-assets/console.js?v=2"></script>
  </head>
  <body class="kc-console" data-page="login">
    <header class="kc-navbar">
      <div class="kc-navbar-inner">
        <a class="kc-brand" href="/login"
          ><img src="/console-logo.png" alt="" width="32" height="32" /><strong
            >CrispAI</strong
          ><span class="kc-beta">Beta</span></a
        ><button
          type="button"
          class="kc-header-button"
          data-theme
          aria-label="切换明暗主题"
        >
          ◐
        </button>
      </div>
    </header>
    <main class="kc-login-main">
      <section class="kc-card kc-login-card">
        <h1>登录管理后台</h1>
        <p class="kc-muted">使用现有管理员账号和密码登录</p>
        <form id="login-form">
          <div class="kc-field">
            <label for="username">账号</label
            ><input
              id="username"
              name="username"
              autocomplete="username"
              maxlength="256"
              placeholder="输入管理员账号"
              required
              autofocus
            />
          </div>
          <div class="kc-field">
            <label for="password">密码</label>
            <div class="kc-password">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                maxlength="8192"
                placeholder="输入登录密码"
                required
              /><button
                type="button"
                class="kc-reveal"
                data-reveal="password"
                aria-label="显示密码"
                aria-pressed="false"
              >
                显示
              </button>
            </div>
          </div>
          <p
            id="form-message"
            class="kc-message"
            role="status"
            aria-live="polite"
          ></p>
          <button
            type="submit"
            id="login-submit"
            class="kc-button kc-primary kc-full"
          >
            登录
          </button>
        </form>
      </section>
    </main>
    <footer class="kc-footer">
      CrispAI ·
      <a
        href="https://github.com/KirCloud/CrispAI"
        target="_blank"
        rel="noopener noreferrer"
        >KirCloud 扩展</a
      >
    </footer>
  </body>
</html>
